<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], outfit: ['Outfit', 'sans-serif'] },
                    colors: { primary: '#0f1115', surface: '#161921', secondary: '#232833' }
                }
            }
        }
    </script>
</head>
<body class="bg-primary text-gray-300 font-sans antialiased min-h-screen">
    
    <!-- Login Section -->
    <div id="login-section" class="flex items-center justify-center min-h-screen">
        <div class="glass-card p-10 rounded-2xl w-full max-w-md">
            <h2 class="text-3xl font-outfit font-bold text-white mb-6 text-center">Admin Login</h2>
            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">Username</label>
                    <input type="text" id="username" class="w-full bg-secondary/50 border border-white/5 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm text-gray-400 mb-2">Password</label>
                    <input type="password" id="password" class="w-full bg-secondary/50 border border-white/5 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium transition-colors">Login</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="hidden min-h-screen p-8">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-4xl font-outfit font-bold text-white">Project Manager</h1>
                <button id="logout-btn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg transition-colors">Logout</button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Add/Edit Form -->
                <div class="glass-card p-6 rounded-2xl h-fit">
                    <h3 id="form-title" class="text-2xl font-bold text-white mb-4">Add Project</h3>
                    <form id="project-form">
                        <input type="hidden" id="project-id">
                        <div class="mb-4">
                            <label class="block text-xs text-gray-400 mb-1">Title</label>
                            <input type="text" id="proj-title" class="w-full bg-secondary border border-white/5 rounded px-3 py-2 text-white text-sm" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs text-gray-400 mb-1">Description</label>
                            <textarea id="proj-desc" rows="3" class="w-full bg-secondary border border-white/5 rounded px-3 py-2 text-white text-sm" required></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs text-gray-400 mb-1">Tech Stack (comma separated)</label>
                            <input type="text" id="proj-tech" placeholder="React, Node.js" class="w-full bg-secondary border border-white/5 rounded px-3 py-2 text-white text-sm">
                        </div>
                        <div class="mb-4">
                            <label class="block text-xs text-gray-400 mb-1">Icon Class (FontAwesome)</label>
                            <input type="text" id="proj-icon" placeholder="fab fa-react" class="w-full bg-secondary border border-white/5 rounded px-3 py-2 text-white text-sm">
                        </div>
                        <div class="mb-6">
                            <label class="block text-xs text-gray-400 mb-1">Color Theme</label>
                            <select id="proj-color" class="w-full bg-secondary border border-white/5 rounded px-3 py-2 text-white text-sm">
                                <option value="blue">Blue</option>
                                <option value="indigo">Indigo</option>
                                <option value="purple">Purple</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 rounded text-white text-sm font-medium">Save</button>
                            <button type="button" id="cancel-edit" class="py-2 px-4 bg-gray-600 hover:bg-gray-500 rounded text-white text-sm hidden">Cancel</button>
                        </div>
                    </form>
                </div>
                
                <!-- Project List -->
                <div class="lg:col-span-2 glass-card p-6 rounded-2xl">
                    <h3 class="text-2xl font-bold text-white mb-4">Existing Projects</h3>
                    <div id="admin-projects-list" class="space-y-4">
                        <!-- Projects injected by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
